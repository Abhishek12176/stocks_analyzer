[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equitylens-api"
version = "0.1.0"
description = "EquityLens Stock Analysis Platform — Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "gunicorn>=21.2.0",
    "groq==1.6.0",
    "pydantic==2.13.1",
    "pydantic-settings==2.14.1",
    "yfinance==1.3.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "pandas-ta==0.4.71b0",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.1",
    "requests==2.32.5",
    "playwright==1.60.0",
    "cachetools==6.2.4",
    "httpx==0.28.1",
    "aiohttp==3.11.16",
    "python-dotenv==1.2.2",
    "vaderSentiment==3.3.2",
    # ML forecasting system (lightweight)
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
ml-extra = [
    "lightgbm>=4.0.0",
    "shap>=0.45.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
