services:
  - type: web
    name: equitylens-api
    env: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps 2>/dev/null || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4 --forwarded-allow-ips '*' --proxy-headers --log-level info
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: EquityLens API
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://stocks-analyzer-9fg7.onrender.com
      - key: NEWSDATA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: groq/compound
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CACHE_TTL_PRICE
        value: "60"
      - key: CACHE_TTL_FUNDAMENTALS
        value: "3600"
      - key: CACHE_TTL_SHAREHOLDING
        value: "86400"
      - key: CACHE_TTL_NEWS
        value: "900"
