services:
  - type: web
    name: equitylens-api
    runtime: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: EquityLens API
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: https://equitylens.vercel.app
      - key: NEWSDATA_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CACHE_TTL_PRICE
        value: "60"
      - key: CACHE_TTL_FUNDAMENTALS
        value: "3600"
      - key: CACHE_TTL_SHAREHOLDING
        value: "86400"
      - key: CACHE_TTL_NEWS
        value: "900"
